name: Atithi Frontend CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  FRONTEND_S3_BUCKET: atithi-frontend-551626543871

jobs:
  deploy:
    name: Build & Deploy Static SPA to AWS CloudFront / S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Check Backend ALB Status & Auto-Heal Routing
        id: tf-outputs
        working-directory: terraform
        run: |
          ALB_STATUS=$(aws elbv2 describe-load-balancers \
            --names atithi-dev-alb \
            --region ${{ env.AWS_REGION }} \
            --query "LoadBalancers[0].State.Code" \
            --output text 2>/dev/null || echo "not-found")
          
          echo "Current Backend ALB Status: $ALB_STATUS"
          
          if [ "$ALB_STATUS" == "active" ]; then
            echo "Backend ALB is active. Initializing & applying Frontend Terraform to sync routing..."
            terraform init -no-color
            terraform apply -var="cloudfront_enabled=true" -auto-approve -no-color
            DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "E3IJXZS95HCP8S")
            BUCKET=$(terraform output -raw s3_bucket_name 2>/dev/null || echo "atithi-frontend-551626543871")
          else
            echo "⚠️ Backend ALB is not active (Backend services are currently paused)."
            echo "Skipping ALB-dependent Terraform apply. Static assets will be safely built and deployed to S3."
            DIST_ID="E3IJXZS95HCP8S"
            BUCKET="atithi-frontend-551626543871"
          fi
          
          echo "CF_DIST_ID=$DIST_ID" >> $GITHUB_OUTPUT
          echo "S3_BUCKET=$BUCKET" >> $GITHUB_OUTPUT
          echo "Target CloudFront Distribution: $DIST_ID"
          echo "Target S3 Bucket: $BUCKET"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Static Production Assets
        run: pnpm run build

      - name: Sync Static Assets to S3 (Immutable Hashed Assets)
        run: |
          echo "Uploading static hashed assets with 1-year immutable cache..."
          aws s3 sync dist/ s3://${{ steps.tf-outputs.outputs.S3_BUCKET || env.FRONTEND_S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html to S3 (No-Cache for Instant Updates)
        run: |
          echo "Uploading index.html with no-cache header..."
          aws s3 cp dist/index.html s3://${{ steps.tf-outputs.outputs.S3_BUCKET || env.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Edge Cache
        run: |
          echo "Creating CloudFront invalidation for fast propagation..."
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf-outputs.outputs.CF_DIST_ID }}" \
            --paths "/*"

      - name: Deployment Verification
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution --id "${{ steps.tf-outputs.outputs.CF_DIST_ID }}" --query "Distribution.DomainName" --output text)
          echo "=========================================================="
          echo "🎉 Frontend is LIVE and accessible at:"
          echo "https://$CF_DOMAIN"
          echo "=========================================================="
