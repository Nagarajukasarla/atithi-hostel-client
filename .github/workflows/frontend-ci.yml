name: Atithi Frontend CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Lint, TypeCheck, and Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm run lint

      - name: Verify TypeScript & Production Build
        run: pnpm run build
